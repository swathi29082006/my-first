<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rock Paper Scissors Game</title>

<style>
body{
    font-family: Arial, sans-serif;
    text-align:center;
    background:#f4f4f4;
    padding:30px;
}

h1{
    color:#333;
}

.game-area{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:80px;
    margin:40px 0;
}

.hand{
    font-size:100px;
}

.player{
    transform:rotate(90deg);
}

.computer{
    transform:rotate(-90deg);
}

button{
    padding:12px 20px;
    margin:10px;
    font-size:18px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    opacity:0.8;
}

#result{
    margin-top:20px;
    font-size:24px;
    font-weight:bold;
}

@keyframes playerShake {
    0% { transform: rotate(90deg) translateY(0); }
    50% { transform: rotate(90deg) translateY(-20px); }
    100% { transform: rotate(90deg) translateY(0); }
}

@key
